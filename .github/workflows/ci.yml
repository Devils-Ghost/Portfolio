name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Next 16 dropped `next lint`, so `next build` no longer runs ESLint.
      # This step is the only thing standing between a rules-of-hooks
      # violation and production.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
